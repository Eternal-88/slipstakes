<script>
// v5.5.5: if part of the game didn't download (a flaky school connection, a
// web filter), say so - it used to leave a half-started page full of errors
window.addEventListener('load', function () {
  if (typeof THREE === 'undefined') return; // (main.js has its own message for that)
  var G = window.G || {};
  var need = ['U', 'Settings', 'Audio', 'TrackDefs', 'Parts', 'Physics', 'CarModel', 'TrackMesh', 'World', 'Input', 'Bot', 'RaceSim', 'HostSession', 'Econ', 'Relay', 'Net', 'HostRace', 'ClientRace', 'Game', 'UI', 'Overlay', 'HUD', 'Chat', 'App'];
  var miss = need.filter(function (k) { return !G[k]; });
  if (!miss.length) return;
  var ui = document.getElementById('ui');
  ui.style.display = '';
  ui.innerHTML = '<div class="fatal"><h1>SLIPSTAKES</h1><p>Part of the game didn’t download. A busy or filtered network can do this.</p><p class="muted">Reload the page (Ctrl+Shift+R). If it keeps happening, wait a minute and try again.</p><p class="muted small">Missing: ' + miss.slice(0, 6).join(', ') + '</p></div>';
});
</script>
